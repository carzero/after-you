const image=(key,cls,alt='')=>`<img class="${cls}" src="${ART[key]}" alt="${alt}" draggable="false">`;
function view(d,i){return `<section class="concept"><div class="concept-head"><span class="badge">${String.fromCharCode(65+i)}</span><div><h2>${d.name}${i===0?'<span class="recommend">추천</span>':''}</h2><p>${d.desc}</p></div></div><div class="phone ${d.id}" data-screen="play" data-design="${d.id}"><div class="scene">${image('sky','sky')}${image('cloud','ambient')}${image('cloud','ambient right')}${image('landmark','landmark')}<div class="bridge">${[1,2,3,4].map(row=>image('tile',`tile r${row}`)+image('tile',`tile r${row} right`)).join('')}<div class="safe-glow"></div></div>${image('potato','hero','직장인 감자')}${image('duck','npc','왕관 오리')}${image('pigeon','npc second','넥타이 비둘기')}<span class="you-tag">나</span><div class="glass-top"></div></div><div class="hud"><div class="score"><small>${d.id==='rush'?'HEIGHT / 현재 높이':d.id==='story'?'TWELFTH STEP':'현재 높이'}</small><strong><b class="value">12</b><span>층</span></strong><div class="best">최고 기록 84층</div></div><div class="pill">◷ <span class="seconds">28</span>초</div><button class="pause" aria-label="일시정지">Ⅱ</button></div><div class="chapter">CHAPTER 01<b>구름 정거장</b></div><div class="dock"><div class="hint"><i></i>${d.hint}</div><div class="moves"><button class="move" data-side="left"><span>↖</span>왼쪽</button><button class="move" data-side="right">오른쪽<span>↗</span></button></div><div class="foot"><span>${d.foot}</span>${d.id==='story'?'':'<span class="progress"></span><span>4 / 10</span>'}</div></div><div class="title-view">${image('poster','poster')}<div class="title-shade"></div>${image('logo','logo','먼저 가세요 AFTER YOU')}<div class="intro"><div class="tiny">${d.label}</div><h3>${d.title}</h3><p>${d.line}</p><div class="cast">${['potato','pigeon','duck','rabbit'].map((id,j)=>`<button data-character="${id}" class="${j===0?'active':''}" aria-label="${['감자','비둘기','오리','토끼'][j]} 시안 보기">${image('portrait_'+id,'')}</button>`).join('')}</div><button class="primary start">구름 위로 출발　↗</button><button class="secondary ranking">나의 기록과 순위 보기　→</button></div></div><div class="result-view"><div class="seal">WISH RECEIVED</div>${image('finished','result-character')}<div class="tiny">STAGE CLEAR</div><h3>${d.result}</h3><p>${d.quote.replaceAll('\n','<br>')}</p><div class="record"><div><small>도달 높이</small><b>18 <small style="display:inline">층</small></b></div><div><small>이번 기록</small><b>18.42 <small style="display:inline">초</small></b></div></div><button class="primary again">다음 구름으로　↗</button><button class="secondary home">정거장으로 돌아가기</button></div></div><p class="concept-foot">${i===0?'정보를 모서리로 옮겨 플레이 공간을 넓혔습니다. 기존 분위기를 이어가며 실제 게임에 옮기기 가장 쉬운 안입니다.':i===1?'높이와 최고 기록을 먼저 읽게 하고 큰 버튼으로 반복 도전을 강조합니다. 경쟁형 게임의 인상이 가장 강합니다.':'점수를 중앙에 작게 두고 풍경과 캐릭터를 먼저 보게 합니다. 원형 버튼과 절제된 색으로 동화 같은 분위기를 냅니다.'}</p></section>`}
document.querySelector('#grid').innerHTML=designs.map(view).join('');
function screen(name){document.querySelectorAll('.phone').forEach(p=>p.dataset.screen=name);document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===name))}
document.querySelector('.switch').onclick=e=>{const b=e.target.closest('[data-screen]');if(b)screen(b.dataset.screen)};
for(const p of document.querySelectorAll('.phone')){
 p.querySelector('.start').onclick=()=>screen('play');p.querySelector('.again').onclick=()=>screen('play');p.querySelector('.home').onclick=()=>screen('title');p.querySelector('.ranking').onclick=()=>screen('result');
 let paused=false,steps=0,timer;
 p.querySelector('.pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.setAttribute('aria-label',paused?'계속하기':'일시정지');p.querySelector('.hint').textContent=paused?'잠시 쉬어가는 중이에요.':designs.find(d=>d.id===p.dataset.design).hint};
 for(const button of p.querySelectorAll('.move'))button.onclick=()=>{if(paused)return;const hero=p.querySelector('.hero');hero.classList.add('hop');clearTimeout(timer);timer=setTimeout(()=>hero.classList.remove('hop'),180);p.querySelector('.value').textContent=12+(++steps);if(steps>=6){steps=0;screen('result')}};
 for(const button of p.querySelectorAll('[data-character]'))button.onclick=()=>{p.querySelectorAll('[data-character]').forEach(b=>b.classList.toggle('active',b===button));p.querySelector('.hero').src=ART[button.dataset.character];};
}
window.showConceptScreen=screen;screen('play');
</script></html>
