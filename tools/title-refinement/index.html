</style><main class="preview"><section class="card" aria-label="A안 밀도 개선 시안"><div class="brand">CARZERO　STUDIO<button class="settings" aria-label="설정 시안">⚙</button></div><div class="heading"><div class="eyebrow">ONE BRIDGE. TOO MUCH POLITENESS.</div><h1>먼저<span>가세요.</span></h1><p class="tagline">소원은 간절합니다.<br>먼저 갈 생각은 없습니다.</p><div class="stamp">양보 중<b>출발자 없음</b></div></div><div class="scene"><img class="island" data-art="start" alt=""><img class="potato" data-art="potato_after" alt="먼저 가라고 손짓하는 감자"><img class="pigeon" data-art="pigeon_after" alt="양보하는 비둘기"><div class="bubble first">먼저 가시죠.</div><div class="bubble second">아뇨, 먼저요.</div><div class="pressure">눈 치 싸 움</div><div class="floor-label">CLOUD STATION · DEPARTURE 001</div></div><div class="bottom"><p class="safety">떨어져도 괜찮아요. 구름이 받아줍니다.</p><button class="prepare">참가자 · 도전 설정 ↓</button><button class="start">제가 먼저 갈게요 ↗</button><button class="record">♧　스코어보드 보기</button></div><div class="note"><div class="ribbon">TITLE A · COMPOSITION REVIEW</div><h2>화면 구성 시안입니다.</h2><p>캐릭터와 말풍선을 모으고<br>긴 화면의 중앙 여백을 줄였습니다.<br>실제 게임에는 아직 적용하지 않았습니다.</p><button class="close">타이틀로 돌아가기</button></div></section></main><script>const ART=__ART__;for(const i of document.querySelectorAll('[data-art]'))i.src=ART[i.dataset.art];for(const b of document.querySelectorAll('button:not(.close)'))b.onclick=()=>document.querySelector('.note').classList.add('open');document.querySelector('.close').onclick=()=>document.querySelector('.note').classList.remove('open');</script></html>
