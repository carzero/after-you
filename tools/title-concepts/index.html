<header class="page-head"><small>AFTER YOU / TITLE IDENTITY 02</small><h1>양보에도, 눈치가 필요하니까.</h1><p>타이틀 전용 구성 시안입니다. ‘먼저 가라고 미루는 게임’의 성격을 세 가지 이야기로 표현했습니다. 실제 게임에는 미적용이며, 숫자와 대화는 시안용 예시입니다.</p></header><main class="grid" id="grid"></main>
<script>
const ART=__ART__;
const img=(k,c,alt='')=>`<img src="${ART[k]}" class="${c}" alt="${alt}">`;

function selection(){return `<div class="selection"><small class="micro">TITLE PREVIEW</small><h3>누가 먼저 가볼까요?</h3><p>타이틀 다음 단계에서 참가자를 고릅니다.<br>이곳은 화면 구성만 확인하는 시안입니다.</p><div class="cast">${['potato','pigeon','duck','rabbit'].map((id,i)=>`<button data-character="${id}" aria-pressed="${i===0}">${img('portrait_'+id,'')}<span>${['직장인 감자','넥타이 비둘기','왕관 오리','근육 토끼'][i]}</span></button>`).join('')}</div><p class="selection-caption">직장인 감자 · 시안용 선택</p><button class="close">타이틀로 돌아가기</button></div>`}
function phone(d){const top=`<div class="topline"><span>${d.id==='office'?'구름 정거장 / 소원 접수처':'CARZERO　STUDIO'}</span><button class="settings" aria-label="설정 시안 안내">⚙</button></div>`;
 if(d.id==='duel')return `${top}<div class="headline"><div class="eyebrow">ONE BRIDGE. TOO MUCH POLITENESS.</div><h2>먼저<span>가세요.</span></h2><p>양보는 빠르게.<br>첫발은 신중하게.</p><span class="tiny-star">✳</span></div><div class="scene">${img('start','island')}${img('potato_after','potato')}${img('pigeon_after','pigeon')}<div class="bubble b1">먼저 가시죠.</div><div class="bubble b2">아뇨, 먼저요.</div><div class="pressure">눈 치 싸 움</div></div><div class="cta"><p class="micro">떨어져도 괜찮아요. 구름이 받아줍니다.</p><button class="start">제가 먼저 갈게요　↗</button><div class="sub-actions"><button class="records">나의 기록</button><button class="rules">어떻게 하나요?</button></div></div>${selection()}`;
 if(d.id==='office')return `${top}<div class="paper"><div class="form-head"><b>소원 접수 신청서</b><span>FORM NO. 001</span></div><div class="ticket-no">001</div><div class="stamp">용기 확인<br>필　요</div><h2>먼저 가세요</h2><div class="form-sub">AFTER YOU / WISH APPLICATION</div><dl><div><dt>신청인</dt><dd>직장인 감자</dd></div><div><dt>소　원</dt><dd>오늘은 조금만 편해지기</dd></div><div><dt>확인사항</dt><dd>첫발은 본인이 내딛습니다.<br><span class="inline-mark">양보만 해도 시간은 흐릅니다.</span></dd></div></dl><div class="sign">위 사항을 읽었으며,<br><b>아마도 준비가 되었습니다.</b></div>${img('potato','paper-character')}</div><div class="postit">주의.<br>양보만 하다가<br>마감됩니다.</div><div class="cta"><p class="micro">접수처는 구름 너머에 있습니다.</p><button class="start">접수하고 출발　↗</button><div class="sub-actions"><button class="records">지난 접수 기록</button><button class="rules">접수 안내</button></div></div>${selection()}`;
 return `${img('sky','sky')}${top}<div class="headline"><div class="eyebrow">기억은 했는데, 왜 발이 안 떨어지지?</div><h2>먼저<br><b>가세요.</b></h2><p>아는 길도, 발은 떨린다.</p></div><span class="small-brand">AFTER YOU</span><div class="scene">${img('start','start-island')}${img('potato_hover','hero')}${img('tile','lone-tile')}<div class="gap-line"></div><div class="whisper">저…<br>제가 먼저요?</div><div class="first-step">THE FIRST STEP</div></div><div class="cta"><p class="micro">한 발을 내딛으면 이야기가 시작됩니다.</p><button class="start">한 발만 가볼까요　↗</button><div class="sub-actions"><button class="records">기록 보기</button><button class="rules">길 건너는 법</button></div></div>${selection()}`;
}
document.querySelector('#grid').innerHTML=data.map((d,i)=>`<section class="concept"><div class="label"><span class="letter">${'ABC'[i]}</span><div><h2>${d.title}${i===0?'<span class="recommend">추천</span>':''}</h2><p>${d.note}</p></div></div><div class="phone ${d.id}" data-design="${d.id}">${phone(d)}</div><p class="description">${d.desc}</p></section>`).join('');
for(const p of document.querySelectorAll('.phone')){const panel=p.querySelector('.selection');p.querySelector('.start').onclick=()=>panel.classList.add('open');p.querySelector('.close').onclick=()=>panel.classList.remove('open');for(const b of p.querySelectorAll('[data-character]'))b.onclick=()=>{p.querySelectorAll('[data-character]').forEach(a=>a.setAttribute('aria-pressed',a===b));p.querySelector('.selection-caption').textContent=b.textContent.trim()+' · 시안용 선택'};p.querySelector('.rules').onclick=()=>{panel.classList.add('open');p.querySelector('.selection-caption').textContent='길을 기억하고 한 걸음씩. 추락하면 이전 스테이지로 돌아갑니다.'};p.querySelector('.records').onclick=()=>{panel.classList.add('open');p.querySelector('.selection-caption').textContent='기록 화면과 실제 순위는 이번 시안에 연결하지 않았습니다.'};p.querySelector('.settings').onclick=()=>{panel.classList.add('open');p.querySelector('.selection-caption').textContent='음악·효과음·움직임 줄이기는 실제 게임의 설정을 유지할 예정입니다.'};}
</script></html>
