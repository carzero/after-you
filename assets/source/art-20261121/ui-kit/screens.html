<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>먼저 가세요 화면 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#ede5da;color:#514237;font:16px system-ui}aside{padding:12px;text-align:center}select{font:inherit;padding:8px}#phone{position:relative;width:min(100vw,390px);height:min(844px,calc(100dvh - 110px));min-height:450px;margin:auto;overflow:hidden;background:linear-gradient(#ffdfb6,#d5c4e4);border-radius:24px}#screen{height:100%;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}h1,h2,p{margin:0}h1{font-size:32px;text-align:center}h2{font-size:23px}p{text-align:center;line-height:1.5}.small{font-size:13px}button{font:inherit;color:#514237;background:#c8e4d8;border:2px solid #6d897e;border-radius:16px;padding:12px;min-height:48px;cursor:pointer}button:focus-visible{outline:3px solid #514237;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.panel{background:#fffaf0;border:2px solid #d5c4aa;border-radius:22px;padding:20px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}.row{display:flex;gap:8px;justify-content:center;align-items:center}.portrait{width:100%;height:100px;object-fit:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.card{padding:8px}.card[aria-pressed=true]{outline:3px solid #514237}.hero{width:100%;max-height:34%;object-fit:contain}.bottom{margin-top:auto;width:100%;display:grid;gap:8px}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.overlay{z-index:1;position:relative;width:100%;text-align:center}.tag{font-size:12px;background:#fffaf0;padding:6px;border-radius:8px}label{display:flex;justify-content:space-between;align-items:center;min-height:48px}input{width:24px;height:24px} .icon{width:32px;height:32px}</style><aside><b>화면 검수용 · 게임 기능 미연결</b><br><select id="nav" aria-label="검수 화면"></select></aside><div id="phone"><div id="screen"></div></div><script>
const scenes={title:'타이틀',intro:'초대장',stages:'스테이지 선택',characters:'캐릭터 선택',play:'플레이 구도',hint:'경로 힌트 안내',pause:'일시정지',settings:'설정',success:'성공 결과',fall:'추락 결과',timeout:'시간 종료',unlock:'챕터 완료·해금',ending:'엔딩 준비 중',notice:'저장 안내'};
const names={potato:'직장인 감자',pigeon:'넥타이 비둘기',duck:'왕관 오리',rabbit:'근육 토끼'};const wishes={potato:'출근 없이 월급 받기',pigeon:'사람들이 피하지 않기',duck:'진짜 왕이 되기',rabbit:'긴 다리 갖기'};let chosen='potato';
const nav=document.querySelector('#nav'),screen=document.querySelector('#screen');nav.innerHTML=Object.entries(scenes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');nav.onchange=()=>show(nav.value);
function btn(text,target){return `<button onclick="show('${target}')">${text}</button>`}function portrait(id){return `<img class="portrait" src="art/${id}.png" alt="${names[id]}">`}function panel(title,body){return `<div class="panel"><h2>${title}</h2>${body}</div>`}
function show(id){nav.value=id;let h='';
if(id==='title')h=`<img class="bg" src="art/title.png" alt="서로 먼저 가라고 권하는 네 참가자"><div class="overlay"><h1>먼저 가세요</h1><p class="small">소원은 간절합니다.<br>먼저 갈 생각은 없습니다.</p></div><div class="bottom overlay">${btn('출발 준비','stages')}${btn('설정','settings')}</div>`;
if(id==='intro')h=`<h2>초대장이 도착했어요</h2><img class="hero" src="art/invitation.png" alt="황금 초대장">${panel('소원 접수 대상자 선정','<p>구름 위 접수처까지 방문하시면<br>소원을 하나 들어드립니다.</p><p class="small">※ 방문 접수만 가능합니다.</p>')}<div class="bottom">${btn('접수처로 가기','stages')}</div>`;
if(id==='stages')h=`<h2>구름 정거장</h2><p>1챕터 · 3스테이지</p>${panel('방문 접수 안내','<p>두 발판 중 하나가 안전해요.<br>서두르되 발밑을 확인하세요.</p>')}<div class="row">${btn('1','characters')}<button disabled>🔒 2</button><button disabled>🔒 3</button></div><p class="small">현재·잠금 상태를 보여 주는 시안입니다.</p><div class="bottom">${btn('초대장 보기','intro')}${btn('처음으로','title')}</div>`;
if(id==='characters')h=`<h2>누가 먼저 갈까요?</h2><div class="grid">${Object.keys(names).map(k=>`<button class="card" aria-pressed="${chosen===k}" onclick="chosen='${k}';show('characters')">${portrait(k)}${names[k]}</button>`).join('')}</div>${panel('소원',`<p>${wishes[chosen]}</p><p class="small">캐릭터 성능은 모두 같아요.</p>`)}<span class="tag">해금 후 선택 화면 시안</span><div class="bottom">${btn('출발','hint')}</div>`;
if(id==='play')h=`<img class="bg" src="art/gameplay.png" alt="이동 중 플레이 구도 참고"><div class="overlay tag">정적 구도 시안 · 플레이 불가</div><div class="bottom overlay">${btn('일시정지 시안','pause')}${btn('성공 결과 보기','success')}${btn('추락 결과 보기','fall')}</div>`;
if(id==='hint')h=`<h2>발판을 기억하세요</h2>${panel('안전 경로 미리보기','<p>안전 표시가 사라지면 출발해요.</p><p class="small">실제 경로와 카운트다운은 게임에서 표시됩니다.</p>')}<div class="bottom">${btn('플레이 구도 보기','play')}</div>`;
if(id==='pause')h=panel('잠깐 쉬어가세요',btn('계속하기','play')+btn('설정','settings')+btn('처음으로','title'));
if(id==='settings')h=panel('설정',['음악','효과음','진동','움직임 줄이기'].map((t,i)=>`<label>${t}<input type="checkbox" ${i<2?'checked':''}></label>`).join('')+'<p class="small">표시 시안: 소리·진동·저장과 연결되지 않습니다.</p>'+btn('닫기','title'));
if(id==='success')h=`<img class="hero" src="art/stamp.png" alt="접수 도장">${panel('무사히 도착했어요','<p>접수 완료</p><p>기록: —</p><p class="small">실제 기록은 게임 데이터로 표시</p>')}<div class="bottom">${btn('다음 스테이지','stages')}${btn('한 번 더','hint')}</div>`;
if(id==='fall')h=panel('재방문을 환영합니다',portrait(chosen)+'<p>구름 회수반이 안전하게 모셨어요.</p><p class="small">구조·반송 모션은 별도 제작·통합 필요</p>'+btn('다시 출발','hint'));
if(id==='timeout')h=panel('접수 시간이 끝났어요','<img class="icon" src="icons/timer_v001.svg" alt="시간 종료"><p>다음 접수 때 다시 도전해요.</p>'+btn('다시 출발','hint'));
if(id==='unlock')h=panel('구름 정거장 완료','<p>네 참가자를 선택할 수 있어요.</p><div class="grid">'+Object.keys(names).map(portrait).join('')+'</div><p>다음 챕터는 준비 중이에요.</p>'+btn('참가자 선택','characters'));
if(id==='ending')h=panel('소원 앨범','<p>본편 엔딩은 준비 중이에요.</p><p class="small">4인 엔딩 원화·전체 챕터 미완성</p>'+btn('처음으로','title'));
if(id==='notice')h=panel('기록을 저장할 수 없어요','<p>현재 창에서는 계속 플레이할 수 있어요.<br>창을 닫으면 진행 기록이 남지 않을 수 있어요.</p>'+btn('확인','title'));
screen.innerHTML=h;screen.scrollTop=0;}show('title');
</script></html>
